<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Phaser Prototype</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000; }
        canvas { display: block; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.js"></script>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            backgroundColor: '#87CEEB', // Sky blue
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 300 },
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        function preload() {
            this.load.image('player', 'Assets/Sprites/joueur.png');
        }

        function create() {
            // Generate texture for the ground (Green)
            const groundGraphics = this.make.graphics({ x: 0, y: 0, add: false });
            groundGraphics.fillStyle(0x00ff00, 1);
            groundGraphics.fillRect(0, 0, 800, 50);
            groundGraphics.generateTexture('ground', 800, 50);

            // Add Ground
            const platforms = this.physics.add.staticGroup();
            // Position: x=400 (center of 800), y=575 (bottom 50px high, center is at 25px from bottom)
            platforms.create(400, 575, 'ground');

            // Add Player
            this.player = this.physics.add.sprite(400, 100, 'player');
            this.player.setBounce(0.2);
            this.player.setCollideWorldBounds(true);

            // Add Collision
            this.physics.add.collider(this.player, platforms);

            // Input Events
            this.cursors = this.input.keyboard.createCursorKeys();
        }

        function update() {
            if (this.cursors.left.isDown)
            {
                this.player.setVelocityX(-160);
            }
            else if (this.cursors.right.isDown)
            {
                this.player.setVelocityX(160);
            }
            else
            {
                this.player.setVelocityX(0);
            }

            if (this.cursors.up.isDown && this.player.body.touching.down)
            {
                this.player.setVelocityY(-330);
            }
        }
    </script>
</body>
</html>
